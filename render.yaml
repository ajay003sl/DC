databases:
  - name: jershiha-db
    plan: free
    region: singapore
    databaseName: jershiha_store
    user: jershiha_admin

services:
  - type: web
    name: jershiha-fashion
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: jershiha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORE_NAME
        value: Jershiha Fashion
      - key: STORE_WHATSAPP_NUMBER
        value: "919876543210"
      - key: STORE_PHONE
        value: "+91 98765 43210"
      - key: STORE_EMAIL
        value: care@jershihafashion.com
      - key: STORE_ADDRESS
        value: "Thazheveettuvilakam, Puthiyathura, Pulluvila P.O. - 695526"
      - key: STORE_MAPS_EMBED_URL
        value: "https://maps.google.com/maps?q=Thazheveettuvilakam%2C+Puthiyathura%2C+Pulluvila+P.O.+695526&t=&z=16&ie=UTF8&iwloc=&output=embed"
